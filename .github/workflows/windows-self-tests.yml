name: Windows self-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  self-tests:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify repository checksums
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($line in Get-Content -LiteralPath 'SHA256SUMS.txt' -Encoding UTF8) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $parts = $line -split '  ', 2
            if ($parts.Length -ne 2) { throw 'Invalid checksum entry.' }
            $actual = (Get-FileHash -LiteralPath $parts[1] -Algorithm SHA256).Hash
            if ($actual -ne $parts[0]) { throw ('Checksum mismatch: ' + $parts[1]) }
          }
          Write-Host 'All repository checksums match.'

      - name: Build Windows package
        shell: powershell
        run: tools/build-windows.ps1

      - name: Compile and run offline self-tests
        shell: powershell
        env:
          BRICKLASARE_TEST_ARCHIVE: ${{ github.workspace }}\dist\Bricklasaren-3.6.7-Windows.zip
          BRICKLASARE_TEST_IMAGES: ${{ runner.temp }}\bricklasare-ui
        run: |
          & .\Program\Starta-Bricklasaren.ps1 -SelfTestOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer rejects tampered update plans
        shell: powershell
        run: tools/test-update-installer.ps1

      - name: Verify normal startup skips regression-test I/O
        shell: powershell
        run: tools/test-startup.ps1

      - name: Test read-only legacy reader inspection without hardware
        shell: powershell
        run: tools/test-reader-ui-inspection.ps1

      - name: Build separate read-only inspection package
        shell: powershell
        run: tools/build-reader-ui-inspection.ps1

      - name: Parse installation and packaging scripts
        shell: powershell
        run: |
          foreach ($path in @('Program/Install-Update.ps1', 'tools/build-windows.ps1', 'tools/test-startup.ps1', 'tools/test-update-installer.ps1')) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }

      - name: Save rendered Windows interface
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-interface
          path: |
            ${{ runner.temp }}\bricklasare-ui
            dist/Bricklasaren-3.6.7-Windows.zip
          if-no-files-found: ignore
          retention-days: 3

      - name: Save separate read-only reader inspection tool
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gen1-sound-inspection
          path: dist/Bricklasaren-Gen1-ljudunderlag-4-Windows.zip
          if-no-files-found: error
          retention-days: 3

  recovery-update:
    name: Recovery-preserving Windows update
    if: github.repository == 'tstenkula/bricklasare' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'tstenkula/bricklasare')
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Check out recovery installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install public packages with saved recovery on a fresh VM
        shell: powershell
        run: tools/test-published-update.ps1 -Case stable-3.6.6 -UseCurrentRecoveryHelper -InstallOnDisposableRunner -OutputDirectory '${{ runner.temp }}\recovery-update-report'
      - name: Retain recovery-preserving installer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-preserving-update
          path: ${{ runner.temp }}\recovery-update-report
          if-no-files-found: warn
          retention-days: 3
