name: Published update acceptance

on:
  workflow_dispatch:
    inputs:
      case:
        description: Published installer acceptance case
        type: choice
        default: all
        options:
          - all
          - latest
          - historical
          - stable-3.6.1
          - stable-3.6.2
          - stable-3.6.4
          - preview-3.6.4
          - stable-3.6.5
          - preview-3.6.5
          - stable-3.6.6
          - preview-3.6.6
          - stable-3.6.7
          - preview-3.6.7
  # PRs replay all three immutable published historical cases. New 3.6.7
  # cases require public assets and are dispatched with case=latest after
  # release publication, before activating the new feeds on main.
  pull_request:
    paths:
      - tools/test-published-update.ps1
      - tools/test-published-mac-update.py
      - tools/fixtures/published-stable-3.6.1.feed
      - tools/fixtures/published-stable-3.6.2.feed
      - tools/fixtures/published-stable-3.6.4.feed
      - tools/fixtures/published-preview-3.6.4.feed
      - tools/fixtures/published-stable-3.6.5.feed
      - tools/fixtures/published-preview-3.6.5.feed
      - tools/fixtures/published-stable-3.6.6.feed
      - tools/fixtures/published-preview-3.6.6.feed
      - tools/fixtures/published-stable-3.6.7.feed
      - tools/fixtures/published-preview-3.6.7.feed
      - .github/workflows/published-update-acceptance.yml

permissions:
  contents: read

concurrency:
  group: published-update-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Published Windows ${{ matrix.case }}
    if: github.repository == 'tstenkula/bricklasare' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == 'tstenkula/bricklasare' && github.event.pull_request.base.repo.full_name == 'tstenkula/bricklasare' && github.head_ref != ''))
    runs-on: windows-2022
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(inputs.case == 'stable-3.6.7' && '["stable-3.6.7"]' || inputs.case == 'preview-3.6.7' && '["preview-3.6.7"]' || inputs.case == 'stable-3.6.6' && '["stable-3.6.6"]' || inputs.case == 'preview-3.6.6' && '["preview-3.6.6"]' || inputs.case == 'stable-3.6.5' && '["stable-3.6.5"]' || inputs.case == 'preview-3.6.5' && '["preview-3.6.5"]' || inputs.case == 'latest' && '["stable-3.6.7","preview-3.6.7"]' || inputs.case == 'stable-3.6.4' && '["stable-3.6.4"]' || inputs.case == 'preview-3.6.4' && '["preview-3.6.4"]' || inputs.case == 'all' && '["historical","stable-3.6.1","stable-3.6.2","stable-3.6.4","preview-3.6.4","stable-3.6.5","preview-3.6.5","stable-3.6.6","preview-3.6.6","stable-3.6.7","preview-3.6.7"]' || inputs.case == 'historical' && '["historical"]' || inputs.case == 'stable-3.6.1' && '["stable-3.6.1"]' || inputs.case == 'stable-3.6.2' && '["stable-3.6.2"]' || '["historical","stable-3.6.1","stable-3.6.2"]') }}
    steps:
      - name: Check out acceptance tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and install the actual public packages
        shell: powershell
        env:
          ACCEPTANCE_CASE: ${{ matrix.case }}
        run: tools/test-published-update.ps1 -Case $env:ACCEPTANCE_CASE -InstallOnDisposableRunner -OutputDirectory '${{ runner.temp }}\published-windows-report'
      - name: Retain Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-windows-update-acceptance-${{ matrix.case }}
          path: ${{ runner.temp }}\published-windows-report
          if-no-files-found: warn
          retention-days: 3

  macos:
    name: Published Mac ${{ matrix.case }}
    if: github.repository == 'tstenkula/bricklasare' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == 'tstenkula/bricklasare' && github.event.pull_request.base.repo.full_name == 'tstenkula/bricklasare' && github.head_ref != ''))
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(inputs.case == 'stable-3.6.7' && '["stable-3.6.7"]' || inputs.case == 'preview-3.6.7' && '["preview-3.6.7"]' || inputs.case == 'stable-3.6.6' && '["stable-3.6.6"]' || inputs.case == 'preview-3.6.6' && '["preview-3.6.6"]' || inputs.case == 'stable-3.6.5' && '["stable-3.6.5"]' || inputs.case == 'preview-3.6.5' && '["preview-3.6.5"]' || inputs.case == 'latest' && '["stable-3.6.7","preview-3.6.7"]' || inputs.case == 'stable-3.6.4' && '["stable-3.6.4"]' || inputs.case == 'preview-3.6.4' && '["preview-3.6.4"]' || inputs.case == 'all' && '["historical","stable-3.6.1","stable-3.6.2","stable-3.6.4","preview-3.6.4","stable-3.6.5","preview-3.6.5","stable-3.6.6","preview-3.6.6","stable-3.6.7","preview-3.6.7"]' || inputs.case == 'historical' && '["historical"]' || inputs.case == 'stable-3.6.1' && '["stable-3.6.1"]' || inputs.case == 'stable-3.6.2' && '["stable-3.6.2"]' || '["historical","stable-3.6.1","stable-3.6.2"]') }}
    steps:
      - name: Check out acceptance tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and install the actual public packages
        env:
          ACCEPTANCE_CASE: ${{ matrix.case }}
        run: python3 tools/test-published-mac-update.py --case "$ACCEPTANCE_CASE"
      - name: Retain Mac acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-mac-update-acceptance-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/bricklasare-published-mac-update/*.json
            ${{ runner.temp }}/bricklasare-published-mac-update/*.log
          if-no-files-found: warn
          retention-days: 3
